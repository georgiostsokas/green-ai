name: Preserve macOS launcher permissions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve-permissions:
    if: github.repository == 'georgiostsokas/green-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve executable permission for the macOS launcher
        run: |
          git update-index --chmod=+x Open_Green_AI.command
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Preserve macOS launcher executable permission'
            git push origin HEAD:main
          fi
