name: Bug report
description: A wrong number, a crash, or a log the tool cannot read
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command, code or dashboard steps, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `green-ai version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python and OS
      placeholder: Python 3.13, macOS 15
